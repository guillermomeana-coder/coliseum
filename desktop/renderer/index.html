<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Coliseum Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Coliseum</h1>
    <ol id="steps">
      <li>Auth</li><li>Theme</li><li>Repos</li><li>Start</li>
    </ol>
  </header>
  <main id="content"></main>
  <section id="running" hidden>
    <h2>Foreman: <span id="run-status">starting</span></h2>
    <pre id="log"></pre>
    <div class="row">
      <button id="stop" class="secondary">Stop</button>
      <button id="open-setup" class="secondary">Open setup</button>
    </div>
  </section>
  <p id="error" role="alert"></p>
  <footer id="nav">
    <button id="back" class="secondary">Back</button>
    <button id="next">Next</button>
  </footer>
  <script src="wizard.js"></script>
</body>
</html>
